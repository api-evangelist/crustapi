openapi: 3.2.0
info:
  title: Crust LinkedIn API
  version: 2.1.0
  description: People Refresh, public LinkedIn profiles, companies, posts, jobs and people search, plus Google Maps and Search. LinkedIn data uses public, logged-out sources. Returned fields vary by record. Wallet accounts use prepaid USD funds at each deposit’s saved endpoint rates. Eligible accounts receive $6 of free usage monthly; paid funds never expire. Empty and failed results are uncharged. Use explicit USD billing fields for accounting. See https://crustapi.com/docs and https://crustapi.com/pricing.
servers:
- url: https://crustapi.com
security:
- ApiKeyAuth: []
tags:
- name: Linked In
  description: People Refresh and public LinkedIn data.
paths:
  /v1/linkedin:
    get:
      operationId: linkedin
      summary: Refresh a person or retrieve public LinkedIn data
      description: Set type=refresh and provide a LinkedIn profile URL for current public details at the response root. Person/profile returns a profile object; company a company object; posts and people/search arrays; a job URL returns one record under jobs while job searches return an array. Field availability varies. Each successful operation uses its endpoint rate; enriched People is billed per full profile and Refresh per accessible profile. Empty and failed results are uncharged. Missing values or URL status do not prove a job change or permanent deletion.
      parameters:
      - name: type
        in: query
        required: false
        description: 'What to fetch. Singular gets the one you point at, plural finds many: person (one profile by URL) / people (find people by keywords) / company / job (one job by URL) / jobs (find jobs by keywords) / posts / refresh (fast freshness check). `profile` and `search` are the previous names for person and people and keep working unchanged.'
        schema:
          type: string
          default: profile
          enum:
          - refresh
          - person
          - profile
          - company
          - people
          - search
          - posts
          - job
          - jobs
      - name: url
        in: query
        required: false
        description: Profile URL for Refresh/person, company URL for company, person/company URL for posts, or job URL for job.
        schema:
          type: string
      - name: member
        in: query
        required: false
        description: 'Refresh: `member=true` adds the numeric member ID when available.'
        schema:
          type: boolean
          default: false
      - name: keywords
        in: query
        required: false
        description: Search text for people or jobs. Supported filters can also be used without keywords.
        schema:
          type: string
      - name: location
        in: query
        required: false
        description: People or job location. For jobs, separate up to three locations with semicolons.
        schema:
          type: string
      - name: company
        in: query
        required: false
        schema:
          type: string
        description: 'People: current employer. Jobs: company name, LinkedIn company URL or numeric ID.'
      - name: school
        in: query
        required: false
        schema:
          type: string
        description: School filter for people search.
      - name: title
        in: query
        required: false
        description: Profession filter for people search. Combine with location; unsupported professions can return no results.
        schema:
          type: string
      - name: profession
        in: query
        required: false
        schema:
          type: string
        description: Alias of the people-search `title` filter.
      - name: industry
        in: query
        required: false
        schema:
          type: string
        description: Industry filter for people search.
      - name: companySize
        in: query
        required: false
        schema:
          type: string
        description: Employer size filter for people search.
      - name: pastCompany
        in: query
        required: false
        schema:
          type: string
        description: Previous-employer filter for people search.
      - name: followersMin
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: Minimum follower count for people search.
      - name: followersMax
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: Maximum follower count for people search.
      - name: connectionsMin
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: Minimum connection count for people search.
      - name: connectionsMax
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: Maximum connection count for people search.
      - name: expCountMin
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: Minimum employment-row count for people search.
      - name: expCountMax
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: Maximum employment-row count for people search.
      - name: titleExclude
        in: query
        required: false
        schema:
          type: string
        description: Exclude titles from people or job searches. Comma-separate multiple values.
      - name: companyExclude
        in: query
        required: false
        schema:
          type: string
        description: Exclude employers from people search. Comma-separate multiple values.
      - name: locationExclude
        in: query
        required: false
        schema:
          type: string
        description: Exclude locations from people or job searches. Semicolon-separate multiple locations.
      - name: pastCompanyExclude
        in: query
        required: false
        schema:
          type: string
        description: Exclude previous employers from people search. Comma-separate multiple values.
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
        description: 'Jobs: newest first by default; use `relevance` for relevance order.'
      - name: postedWithin
        in: query
        required: false
        schema:
          type: string
        description: 'Jobs: `24h`, `week` or `month` publication window.'
      - name: daysSincePostedMin
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: 'Jobs: minimum days since posting.'
      - name: daysSincePostedMax
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: 'Jobs: maximum days since posting.'
      - name: employmentType
        in: query
        required: false
        schema:
          type: string
        description: 'Jobs: comma-separated employment types, such as `Full-time,Contract`.'
      - name: seniority
        in: query
        required: false
        schema:
          type: string
        description: 'Jobs: comma-separated seniority levels, such as `Director,Executive`.'
      - name: titleInclude
        in: query
        required: false
        schema:
          type: string
        description: 'Jobs: comma-separated terms to match in the title.'
      - name: descriptionKeywords
        in: query
        required: false
        schema:
          type: string
        description: 'Jobs: comma-separated terms to match in the title or description.'
      - name: hasRecruiter
        in: query
        required: false
        schema:
          type: string
        description: 'Jobs: `true` requires a published job poster; `false` excludes those postings.'
      - name: count
        in: query
        required: false
        schema:
          type: boolean
        description: 'People/jobs: `count=true` returns a free count preview without rows. Counts can be unavailable or capped; check the returned metadata.'
      - name: num
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: Requested result count. Jobs default to 25 (max 100); posts to 50 (max 100). People limits depend on search type.
      - name: limit
        in: query
        required: false
        description: Alternative result-count parameter. Jobs default to 25 (max 100); posts to 50 (max 100). People limits depend on search type.
        schema:
          type: integer
          minimum: 1
      - name: start
        in: query
        required: false
        description: Result offset for supported searches.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: email
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: 'Person/profile: `email=true` adds work-email fields when available.'
      - name: domain
        in: query
        required: false
        schema:
          type: string
        description: Known employer domain for the person/profile email lookup.
      - name: companyId
        in: query
        required: false
        schema:
          type: boolean
        description: 'Person/profile: `true` requests the first returned company’s numeric ID. Other rows may already include IDs.'
      - name: schoolId
        in: query
        required: false
        schema:
          type: boolean
        description: 'Person/profile: `true` requests the first returned school’s numeric ID. Other rows may already include IDs.'
      - name: headline
        in: query
        required: false
        description: 'Person/profile: `headline=true` requests the optional `publicHeadline` field.'
        schema:
          type: boolean
          default: false
      - name: employees
        in: query
        required: false
        description: 'Company: `employees=true` adds matching-people results.'
        schema:
          type: boolean
          default: false
      - name: comments
        in: query
        required: false
        description: 'Posts: `comments=true` adds available comments.'
        schema:
          type: boolean
          default: false
      - name: enrich
        in: query
        required: false
        description: 'People/search: `enrich=true` adds available full profiles, billed per profile returned.'
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Response for the selected operation. Unavailable profiles/Refresh are uncharged; inspect accessible and profileState where returned.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/LinkedInRefresh'
                - $ref: '#/components/schemas/LinkedInResult'
        '400':
          description: Missing or invalid url or keywords.
        '401':
          description: Missing or invalid API key.
        '402':
          description: Insufficient available balance or legacy credits. No successful result is charged when the operation cannot be funded.
        '429':
          description: Rate limited.
        '503':
          description: LinkedIn temporarily unavailable, retry shortly (uncharged).
      tags:
      - Linked In
  /v1/linkedin/batch:
    post:
      operationId: linkedinBatch
      summary: Process a list of LinkedIn URLs
      description: 'Up to 100 URLs synchronously, or 10,000 with a public HTTPS webhook. Supported types: refresh, person/profile, company, posts. Results remain in input order. Each row carries its own data or error and successful rows use the chosen endpoint rate. Large webhook payloads may be replaced by a temporary resultsUrl; download before resultsExpireAt. Status requests return counts and delivery state, not result rows. Webhooks cannot contain embedded credentials; redirects are not followed and failed delivery is retried once.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - urls
              properties:
                urls:
                  type: array
                  items:
                    type: string
                  maxItems: 10000
                  description: URL list. Maximum 100 without webhook; maximum 10,000 with webhook. Use the URL type required by the operation.
                  minItems: 1
                type:
                  type: string
                  enum:
                  - refresh
                  - person
                  - profile
                  - company
                  - posts
                  default: refresh
                member:
                  type: boolean
                  default: false
                  description: 'refresh only: also return memberIdentifier.'
                webhook:
                  type: string
                  format: uri
                  description: Public HTTPS URL for asynchronous delivery. Required for more than 100 URLs.
                comments:
                  type: boolean
                  default: false
                  description: 'Posts only: include available comments.'
      responses:
        '200':
          description: Per-URL results in input order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  succeeded:
                    type: integer
                  charged:
                    type: integer
                    description: Successful billing-unit count. Use billing.chargedUsd for the USD charge.
                  tookMs:
                    type: integer
                  creditsRemaining:
                    type: integer
                    description: Numeric compatibility count of remaining affordable billing units for wallet accounts; legacy accounts return remaining credits. This is not a dollar amount. Use billing.remainingUsd or wallet.availableUsd for USD accounting.
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        ok:
                          type: boolean
                        data:
                          description: Operation payload without the single-request timing/billing envelope. Refresh is a flat object; person/company are objects; posts is an array. May be null for unavailable data.
                          anyOf:
                          - type: object
                            additionalProperties: true
                          - type: array
                            items:
                              type: object
                              additionalProperties: true
                        error:
                          type: string
                        retryable:
                          type: boolean
                        notAccessible:
                          type: boolean
                          description: Present when the row represents unavailable data; uncharged.
                  billing:
                    $ref: '#/components/schemas/WalletBilling'
                  type:
                    type: string
        '400':
          description: Invalid body, unsupported type, invalid webhook, or more than 100 sync / 10,000 async URLs.
        '401':
          description: Invalid or missing API key.
        '402':
          description: Insufficient available balance or legacy credits. No successful result is charged when the operation cannot be funded.
        '202':
          description: Accepted for asynchronous processing and webhook delivery.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                  status:
                    type: string
                    enum:
                    - accepted
                  count:
                    type: integer
                  note:
                    type: string
        '429':
          description: Rate limited; retry according to response headers.
      tags:
      - Linked In
    get:
      tags:
      - Linked In
      operationId: linkedinBatchStatus
      summary: Read batch status and delivery counts
      description: Uses the same account’s API key. Does not return result rows.
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Batch state and counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type:
                    - string
                    - 'null'
                  type:
                    type:
                    - string
                    - 'null'
                  count:
                    type:
                    - integer
                    - 'null'
                  status:
                    type:
                    - string
                    - 'null'
                  succeeded:
                    type:
                    - integer
                    - 'null'
                  charged:
                    type:
                    - integer
                    - 'null'
                  error:
                    type:
                    - string
                    - 'null'
                  webhookDelivered:
                    type:
                    - boolean
                    - 'null'
                  createdAt:
                    type:
                    - string
                    - 'null'
                  finishedAt:
                    type:
                    - string
                    - 'null'
        '400':
          description: Missing job ID.
        '401':
          description: Invalid or missing API key.
        '404':
          description: No matching job for this account.
components:
  schemas:
    WalletBilling:
      type: object
      description: Optional USD accounting fields for enrolled wallet accounts. Legacy accounts retain numeric credit fields. Monetary values are exact decimal strings.
      properties:
        model:
          type: string
          enum:
          - wallet
        currency:
          type: string
          enum:
          - USD
        chargedUsd:
          type: string
          example: '0.001'
          description: Actual USD usage charge for this request.
        remainingUsd:
          type: string
          example: '5.999'
          description: Available USD funds after settlement.
        units:
          type: integer
          description: Successful billing units, not dollars.
        product:
          type: string
          enum:
          - googleSearch
          - googleMaps
          - linkedinRead
          - linkedinSearch
        debitId:
          type:
          - string
          - 'null'
        reason:
          type:
          - string
          - 'null'
    LinkedInRefresh:
      type: object
      description: Flat native People Refresh response. Optional or unavailable values may be null or omitted.
      properties:
        url:
          type: string
          description: Requested LinkedIn URL.
        lastName:
          type:
          - string
          - 'null'
          description: Published last name.
        titleSource:
          type:
          - string
          - 'null'
          description: '`headline` means the title comes from headline wording; `linkedin` means an explicit role title.'
        firstName:
          type:
          - string
          - 'null'
          description: Published first name.
        tookMs:
          type: integer
          description: Request processing time in milliseconds.
        photo:
          type:
          - string
          - 'null'
          description: Public profile photo URL, or null when unavailable.
        billing:
          $ref: '#/components/schemas/WalletBilling'
          description: Wallet charge and balance as decimal strings in `chargedUsd` and `remainingUsd`, when applicable.
        currentCompany:
          type:
          - object
          - 'null'
          properties:
            name:
              type:
              - string
              - 'null'
            slug:
              type:
              - string
              - 'null'
            linkedInUrl:
              type:
              - string
              - 'null'
            linkedInId:
              type:
              - string
              - 'null'
          additionalProperties: true
          description: 'Current employer object: `name`, `slug`, `linkedInUrl` and `linkedInId` when available. Numeric IDs are strings; missing values can be null.'
        companyState:
          type:
          - string
          - 'null'
          description: 'Employer availability: `public`, `restricted`, `not_published` or `unknown`. Missing data does not prove a job change.'
        resolvedUrl:
          type:
          - string
          - 'null'
          description: Confirmed profile URL when available. Renamed URLs are not automatically discovered.
        headlineSource:
          type:
          - string
          - 'null'
          description: Source label for the returned headline.
        headline:
          type:
          - string
          - 'null'
          description: Published profile headline. It is not necessarily a job title.
        memberIdentifier:
          type:
          - string
          - 'null'
          description: Numeric member ID as a string, when available. Refresh requires `member=true`, which can increase response time.
        currentTitle:
          type:
          - string
          - 'null'
          description: Current role title when supported by the available data. See `titleSource` for its basis.
        memorialized:
          type:
          - boolean
          - 'null'
          enum:
          - true
          - null
          description: True when a public memorialization marker is established; otherwise null. Null does not establish account activity or whether the person is alive.
        memorializedSource:
          type:
          - string
          - 'null'
          enum:
          - linkedin_public_memorialized_banner
          - null
          description: Source label for a returned memorialization marker.
        accessible:
          type: boolean
          description: Whether public profile data was returned.
        photoState:
          type:
          - string
          - 'null'
          description: Availability label for the profile photo.
        profileState:
          type: string
          enum:
          - accessible
          - exists_not_public
          - not_resolvable
          - unknown
          description: Profile URL status. See the profile-status reference below.
        creditsRemaining:
          type:
          - integer
          - 'null'
          description: Numeric balance compatibility value. For wallet dollar amounts, use `billing.remainingUsd`.
        type:
          type: string
          enum:
          - linkedin-refresh
        publicIdentifier:
          type:
          - string
          - 'null'
          description: Public profile handle from the LinkedIn URL.
        currentSchool:
          type:
          - object
          - 'null'
          properties:
            name:
              type:
              - string
              - 'null'
            slug:
              type:
              - string
              - 'null'
            linkedInUrl:
              type:
              - string
              - 'null'
            linkedInId:
              type:
              - string
              - 'null'
          additionalProperties: true
          description: 'Published school object: `name`, `slug`, `linkedInUrl` and `linkedInId` when available. Numeric IDs are strings; missing values can be null.'
      additionalProperties: true
    LinkedInCompany:
      type:
      - object
      - 'null'
      properties:
        name:
          type:
          - string
          - 'null'
          description: Published company name.
        universalName:
          type:
          - string
          - 'null'
          description: Company handle from its LinkedIn URL.
        pageType:
          type: string
          enum:
          - company
          - showcase
          description: Company or showcase page type.
        publishedContacts:
          type: array
          description: Published emails and phone numbers with supporting text and URL. Publication does not verify ownership or reachability.
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - email
                - phone
              value:
                type: string
              source:
                type: string
                enum:
                - company_about
              sourceUrl:
                type: string
                format: uri
              evidence:
                type: string
                description: The qualifying published text.
            additionalProperties: true
        employeeSearchCompanyIds:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Company IDs associated with employee search. These do not replace the company’s own `linkedInId`.
        jobSearchUrl:
          type:
          - string
          - 'null'
          description: Company jobs link, when available. It is not a vacancy count.
        linkedInId:
          type:
          - string
          - 'null'
          description: Numeric LinkedIn company ID as a string.
        tagline:
          type:
          - string
          - 'null'
          description: Published company tagline.
        description:
          type:
          - string
          - 'null'
          description: Published company description.
        website:
          type:
          - string
          - 'null'
          description: Published website URL, when available.
        industry:
          type:
          - string
          - 'null'
          description: Published industry.
        companySize:
          type:
          - string
          - 'null'
          description: Published employee size band.
        employeeCount:
          type:
          - integer
          - 'null'
          description: Employee count reported by LinkedIn. This can differ from the size band.
        employeeCountRange:
          type:
          - object
          - 'null'
          description: Numeric lower and upper bounds of the published size band.
          additionalProperties: true
        headquarters:
          type:
          - string
          - 'null'
          description: Published headquarters location.
        locations:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              addressLines:
                type: array
                items:
                  type: string
                description: Original visible office address lines. They do not imply separately verified city/state/postal components.
              directionsUrl:
                type:
                - string
                - 'null'
                description: Map link published with this office; not geocoded coordinates.
              isPrimary:
                type:
                - boolean
                - 'null'
                description: True only when this office is explicitly marked primary; absence is unknown.
          description: Published offices. Rows may include `addressLines`, `directionsUrl` and `isPrimary`; a map link does not establish coordinates.
        companyType:
          type:
          - string
          - 'null'
          description: Published organization type.
        founded:
          type:
          - string
          - 'null'
          description: Published founding year, when available.
        specialties:
          type:
          - array
          - 'null'
          items:
            type:
            - string
            - 'null'
          description: Published company specialties.
        followers:
          type:
          - integer
          - 'null'
          description: Follower count, when available.
        address:
          type:
          - object
          - 'null'
          properties:
            street:
              type:
              - string
              - 'null'
            city:
              type:
              - string
              - 'null'
            region:
              type:
              - string
              - 'null'
            postalCode:
              type:
              - string
              - 'null'
            country:
              type:
              - string
              - 'null'
          additionalProperties: true
          description: Structured headquarters address, when available.
        logo:
          type:
          - string
          - 'null'
          description: Public company logo URL.
        banner:
          type:
          - string
          - 'null'
          description: Public company banner URL.
        crunchbaseUrl:
          description: Published Crunchbase link, when available.
        similarCompanies:
          type: array
          description: Available related company pages.
          items:
            type: object
            description: A returned source record. Fields vary by record.
            additionalProperties: true
        affiliatedPages:
          type: array
          description: Available affiliated company or showcase pages. An affiliation does not necessarily mean a subsidiary.
          items:
            type: object
            description: A returned source record. Fields vary by record.
            additionalProperties: true
        employeeSample:
          type: array
          description: Partial public employee sample with names and profile URLs. It is not a complete workforce list.
          items:
            type: object
            description: A returned source record. Fields vary by record.
            additionalProperties: true
        featuredProducts:
          type: array
          description: Available featured products with names, links and details. This may be a selection of all products.
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
              linkedinUrl:
                type: string
                format: uri
              category:
                type:
                - object
                - 'null'
                properties:
                  name:
                    type: string
                  linkedinUrl:
                    type: string
                    format: uri
                additionalProperties: false
              description:
                type:
                - string
                - 'null'
              logoUrl:
                type:
                - string
                - 'null'
              imageUrl:
                type:
                - string
                - 'null'
              source:
                type: string
                enum:
                - company_public_products
            required:
            - name
            - linkedinUrl
            - category
            - description
            - logoUrl
            - imageUrl
            - source
        linkedinUrl:
          type:
          - string
          - 'null'
          description: Public LinkedIn URL.
      additionalProperties: true
      description: Public company or showcase page. Published contact details, offices, related pages and visible people are retained when available. Employee samples are not a complete workforce list.
    LinkedInProfile:
      type:
      - object
      - 'null'
      properties:
        id:
          type:
          - string
          - 'null'
          description: Profile identifier.
        name:
          type:
          - string
          - 'null'
          description: Published full name.
        firstName:
          type:
          - string
          - 'null'
          description: Published first name.
        lastName:
          type:
          - string
          - 'null'
          description: Published last name.
        headline:
          type:
          - string
          - 'null'
          description: Published profile headline. It is not necessarily a job title.
        currentTitle:
          type:
          - string
          - 'null'
          description: Current role title when supported by the available data. See `titleSource` for its basis.
        titleSource:
          type:
          - string
