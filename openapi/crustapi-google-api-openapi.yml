openapi: 3.2.0
info:
  title: Crust Google API
  version: 2.1.0
  description: People Refresh, public LinkedIn profiles, companies, posts, jobs and people search, plus Google Maps and Search. LinkedIn data uses public, logged-out sources. Returned fields vary by record. Wallet accounts use prepaid USD funds at each deposit’s saved endpoint rates. Eligible accounts receive $6 of free usage monthly; paid funds never expire. Empty and failed results are uncharged. Use explicit USD billing fields for accounting. See https://crustapi.com/docs and https://crustapi.com/pricing.
servers:
- url: https://crustapi.com
security:
- ApiKeyAuth: []
tags:
- name: Google
  description: Google Maps, Search and other supported types.
paths:
  /v1/search:
    get:
      operationId: search
      summary: Query any Google surface
      description: 'One endpoint for the whole Google menu. Set `type` to choose the surface (default `web`). Each type returns a JSON response under its own key: web/scholar/patents/lens -> `organic`; news -> `news`; shopping -> `shopping`; images -> `images`; videos -> `videos`; maps/places -> `places`; reviews -> `reviews`; autocomplete -> `suggestions`; webpage -> `text` + `metadata` + `jsonld`. Google surfaces are billed per successful request at the Google Search rate, except type=maps, which bills per business returned at the Maps rate. Wallet prices depend on the available funds and their saved rates. Failed and empty results are free. Legacy credit accounts retain their existing billing model.'
      parameters:
      - name: type
        in: query
        required: false
        description: Which Google surface to query.
        schema:
          type: string
          default: web
          enum:
          - web
          - maps
          - places
          - news
          - shopping
          - images
          - videos
          - reviews
          - scholar
          - patents
          - autocomplete
          - webpage
          - lens
      - name: q
        in: query
        required: false
        description: The search query. Required for every type EXCEPT webpage and lens (use `url`) and reviews (use `placeId` / `cid` / `fid`).
        schema:
          type: string
      - name: url
        in: query
        required: false
        description: 'type=webpage: the page URL to scrape. type=lens: the image URL for reverse image search.'
        schema:
          type: string
      - name: gl
        in: query
        required: false
        description: Country code (us, gb, de, ...). Not used by maps, patents, or webpage.
        schema:
          type: string
          default: us
      - name: hl
        in: query
        required: false
        description: Language code (en, es, ...). Not used by patents or webpage.
        schema:
          type: string
          default: en
      - name: page
        in: query
        required: false
        description: Result page. Not used by reviews, autocomplete, webpage, or lens.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: tbs
        in: query
        required: false
        description: Time filter for web/news/images/videos (e.g. qdr:h past hour, qdr:d past day, qdr:w past week, qdr:m past month, qdr:y past year).
        schema:
          type: string
      - name: num
        in: query
        required: false
        description: 'type=reviews: reviews per page (default 20, max 50).'
        schema:
          type: integer
      - name: ll
        in: query
        required: false
        description: 'type=maps: GPS position and zoom as @latitude,longitude,zoom.'
        schema:
          type: string
      - name: placeId
        in: query
        required: false
        description: Google place id (ChIJ...). Optional for maps; identifies the place for reviews.
        schema:
          type: string
      - name: cid
        in: query
        required: false
        description: Google customer id. Optional for maps; identifies the place for reviews.
        schema:
          type: string
      - name: fid
        in: query
        required: false
        description: Google feature id (0x..:0x..). Identifies the place for reviews.
        schema:
          type: string
      - name: sortBy
        in: query
        required: false
        description: 'type=reviews: review sort order.'
        schema:
          type: string
          enum:
          - mostRelevant
          - newest
          - highest
          - lowest
          default: mostRelevant
      - name: nextPageToken
        in: query
        required: false
        description: 'type=reviews: cursor from the previous response to fetch the next page of reviews.'
        schema:
          type: string
      - name: includeMarkdown
        in: query
        required: false
        description: 'type=webpage: also return the page rendered as Markdown.'
        schema:
          type: boolean
          default: false
      - name: location
        in: query
        required: false
        description: City/region hint for web and places.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: 'type=maps only: how many businesses to return (1-100). Each returned business is one Maps billing unit.'
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: stars
        in: query
        required: false
        description: 'Maps: request available 1–5-star review counts in reviewsDistribution. Can increase response time. Alias: details=true.'
        schema:
          type: boolean
      - name: fresh
        in: query
        schema:
          type: integer
        description: Set fresh=1 to request a new Google result. Reused identical searches are marked cached and cacheAgeSeconds.
      - name: details
        in: query
        schema:
          type: boolean
        description: Alias for stars=true on Maps. Requests available 1–5-star review counts and can increase response time.
      responses:
        '200':
          description: Results for the chosen surface. The populated array key depends on `type`.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GoogleMapsResponse'
                - $ref: '#/components/schemas/GoogleWebResponse'
                - $ref: '#/components/schemas/GooglePlacesResponse'
                - $ref: '#/components/schemas/GoogleNewsResponse'
                - $ref: '#/components/schemas/GoogleShoppingResponse'
                - $ref: '#/components/schemas/GoogleImagesResponse'
                - $ref: '#/components/schemas/GoogleVideosResponse'
                - $ref: '#/components/schemas/GoogleReviewsResponse'
                - $ref: '#/components/schemas/GoogleScholarResponse'
                - $ref: '#/components/schemas/GooglePatentsResponse'
                - $ref: '#/components/schemas/GoogleAutocompleteResponse'
                - $ref: '#/components/schemas/GoogleWebpageResponse'
                - $ref: '#/components/schemas/GoogleLensResponse'
        '400':
          description: Missing or invalid parameter.
        '401':
          description: Missing or invalid API key.
        '402':
          description: Insufficient available balance or legacy credits. No successful result is charged when the operation cannot be funded.
        '429':
          description: Rate limited.
        '502':
          description: Upstream fetch failed (uncharged).
        '503':
          description: Surface temporarily unavailable, retry shortly (uncharged).
      tags:
      - Google
