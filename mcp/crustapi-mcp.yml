api: CrustAPI
name: crustapi
description: >-
  First-party MCP server giving MCP clients (Claude Desktop, Cursor, Cline, etc.) live
  Google (Search/Maps/News/Images/Reviews/webpage) and public LinkedIn data. Distributed
  as an npm package run locally over stdio; no hosted/remote MCP endpoint is published.
deployment:
  mode: local-stdio
  install: npx -y crustapi-mcp
  package: https://www.npmjs.com/package/crustapi-mcp
  auth: api-key
  verified: searched
  note: >-
    env CRUSTAPI_API_KEY (key_live_ prefix) required. No remote https MCP endpoint exists;
    the provider ships only the stdio package, so an agent needs a human to install and run
    it first. Agent-native billing is instead reachable directly via the x402 top-up
    endpoint (see conformance) plus the REST API.
version: 0.3.1
