method: searched
source: https://crustapi.com/docs + https://crustapi.com/llms.txt
api: CrustAPI
type: webhooks
note: >-
  CrustAPI publishes no AsyncAPI document and no event/stream bus. It documents ONE
  webhook: asynchronous delivery of large LinkedIn batch jobs. Captured here as a webhook
  catalog (not an AsyncAPI spec — none exists; not fabricated).
webhooks:
- name: linkedin.batch.completed
  trigger: >-
    POST /v1/linkedin/batch with a "webhook" URL in the body (used for large batches, up to
    10,000 URLs). The API answers immediately with HTTP 202 and a jobId.
  delivery:
    method: POST
    to: caller-supplied webhook URL
    headers:
    - name: X-Crustapi-Job
      value: the jobId
    payload: the full batch results
    retry: retried once on failure
  status_check:
    endpoint: GET /v1/linkedin/batch?id=<jobId>
    returns: counts only (results are delivered to the webhook and not retained)
  note: Synchronous batches (<=100 URLs) return inline with no webhook.
